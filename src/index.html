<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Q-Arena</title>
  <meta name="description" content="Trainiere deinen eigenen KI-Kämpfer mit Reinforcement Learning und schick ihn in die Arena.">
  <meta name="theme-color" content="#0f1319">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Q-Arena">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="6" class="bm-bg"/><g class="bm-grid"><path d="M7 1v28M13 1v28M19 1v28M25 1v28M1 7h28M1 13h28M1 19h28M1 25h28"/></g><circle cx="10" cy="22" r="3.6" class="bm-me"/><circle cx="22" cy="10" r="3.6" class="bm-foe"/></svg>
      <span class="brand-name">Q-Arena</span>
    </div>
    <select id="langSel" class="langsel" aria-label="Sprache / Language"></select>
    <button class="btn sm" id="installBtn" hidden>Installieren</button>
    <div class="res" id="res"></div>
  </header>

  <nav class="tabbar" id="tabs" role="tablist" aria-label="Bereiche">
    <button role="tab" data-tab="agent"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="7" width="14" height="11" rx="2"/><path d="M12 3v4M9.5 12v1M14.5 12v1M9 15.5h6"/></svg><span>Agent</span></button>
    <button role="tab" data-tab="training"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4M6.5 7v10M17.5 7v10M21 10v4M6.5 12h11"/></svg><span>Training</span></button>
    <button role="tab" data-tab="tactics"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span>Taktiken</span></button>
    <button role="tab" data-tab="arena"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M9.5 17.5 21 6V3h-3L6.5 14.5M11 19l-6-6M8 16l-4 4"/></svg><span>Arena</span></button>
    <button role="tab" data-tab="duel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5v.01"/></svg><span>Duell</span></button>
    <button role="tab" data-tab="shop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0"/></svg><span>Shop</span></button>
  </nav>

  <main id="view" class="view"></main>

  <div id="battle" class="battle" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="updateBar" class="updatebar" hidden><span id="updateText">Neue Version verfügbar.</span><button class="btn sm primary" id="updateBtn">Neu laden</button></div>
  <noscript><p class="noscript">Q-Arena braucht JavaScript. · Q-Arena needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
